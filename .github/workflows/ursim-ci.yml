name: ursim-ci
# Hardware-in-the-loop CI against the real Universal Robots controller
# software, with no arm in the room. Gate: RTDE stream >= 480 Hz, p99.9 jitter < 2.5 ms.
#
# The offline suite lives in tests.yml and is the gate that must be green on
# every push. This job is heavier and depends on a controller container, so a
# failure here means the hardware path, not the library.
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      ursim:
        image: universalrobots/ursim_e-series
        ports:
          - 29999:29999
          - 30001:30001
          - 30002:30002
          - 30003:30003
          - 30004:30004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy ur_rtde
      - name: wait for the controller
        run: |
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/29999) 2>/dev/null && break; sleep 2; done
      - run: python -m lerobot_ur.ursim_smoke --ip 127.0.0.1 --seconds 5
      - name: Install the package and its test extra
        run: pip install -e ".[test]"
      - name: Offline suite, as a second check alongside the ursim gate
        run: python -m pytest
